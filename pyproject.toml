[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shivamcodelog", email = "shivamcodelog@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chroma>=0.2.0",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-openrouter>=0.2.8",
    "python-dotenv>=1.2.3",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
